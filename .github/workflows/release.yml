name: release

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build and publish (defaults to the VERSION file)
        required: false
      force:
        description: Republish even if the release already exists
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP: Sukurini
  APPCAST_BRANCH: gh-pages
  APPCAST_FILE: appcast.xml

jobs:
  check:
    name: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.resolve.outputs.proceed }}
      short: ${{ steps.resolve.outputs.short }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      archive: ${{ steps.resolve.outputs.archive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            SHORT="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"
            SOURCE=workflow_input
          else
            if [ ! -f VERSION ]; then
              echo "version status=fail reason=version_file_missing path=VERSION"
              exit 1
            fi
            SHORT="$(tr -d '[:space:]' < VERSION)"
            SOURCE=version_file
          fi

          if [ -z "$SHORT" ]; then
            echo "version status=fail reason=version_empty source=$SOURCE"
            exit 1
          fi
          if ! [[ "$SHORT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version status=fail reason=version_malformed value=$SHORT expected=MAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi

          case "$SHORT" in
            *-*)
              CHANNEL=preview
              PRERELEASE=true
              ;;
            *)
              CHANNEL=stable
              PRERELEASE=false
              ;;
          esac

          TAG="v${SHORT}"
          PROCEED=true
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${FORCE:-false}" = "true" ]; then
              echo "version note=release_exists action=republish_forced tag=$TAG"
            else
              PROCEED=false
              echo "version status=skip reason=release_already_exists tag=$TAG"
            fi
          fi

          {
            echo "proceed=$PROCEED"
            echo "short=$SHORT"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "archive=${APP}-${SHORT}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "version resolved source=$SOURCE short=$SHORT tag=$TAG channel=$CHANNEL prerelease=$PRERELEASE proceed=$PROCEED"

  release:
    name: release-macos
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "signing status=fail reason=private_key_secret_missing detail=set_SPARKLE_ED_PRIVATE_KEY_secret"
            exit 1
          fi
          if [ -z "${PLIST_B64:-}" ]; then
            echo "signing status=fail reason=firebase_secret_missing detail=set_GOOGLE_SERVICE_INFO_PLIST_BASE64_secret"
            exit 1
          fi
          python3 Scripts/verify-signing-key.py --info-plist Support/Info.plist

      - name: Select Xcode
        id: xcode
        run: |
          set -euo pipefail
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=/Applications/Xcode.app
            echo "xcode resolve=fallback path=$XCODE_APP"
          else
            echo "xcode resolve=latest-major-26 path=$XCODE_APP"
          fi
          sudo xcode-select -s "$XCODE_APP"
          XCODE_VERSION="$(xcodebuild -version | head -1 | awk '{print $2}')"
          echo "version=$XCODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "toolchain xcode=$XCODE_VERSION swift=$(swift -version 2>&1 | head -1)"

      - name: Restore SwiftPM cache
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Write Firebase config
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PLIST_B64" | base64 -d > Support/GoogleService-Info.plist
          plutil -lint Support/GoogleService-Info.plist > /dev/null
          echo "firebase-config status=written bytes=$(wc -c < Support/GoogleService-Info.plist)"

      - name: Build and sign
        env:
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          make sign
          echo "bundle status=signed identity=adhoc build=$BUILD"

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP_PATH="dist/${APP}.app"
          for required in \
            "$APP_PATH/Contents/MacOS/${APP}" \
            "$APP_PATH/Contents/Resources/GoogleService-Info.plist" \
            "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle" \
            "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"; do
            if [ ! -e "$required" ]; then
              echo "verify status=fail reason=missing path=$required"
              exit 1
            fi
          done
          codesign --verify --deep --strict "$APP_PATH"
          SHORT="$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")"
          BUILD_NUM="$(plutil -extract CFBundleVersion raw "$APP_PATH/Contents/Info.plist")"
          if [ "$SHORT" != "${{ needs.check.outputs.short }}" ]; then
            echo "verify status=fail reason=version_mismatch bundle=$SHORT expected=${{ needs.check.outputs.short }}"
            exit 1
          fi
          echo "verify status=ok short=$SHORT build=$BUILD_NUM archs=$(lipo -archs "$APP_PATH/Contents/MacOS/${APP}")"

      - name: Package archive
        run: |
          set -euo pipefail
          ARCHIVE="${{ needs.check.outputs.archive }}"
          ditto -c -k --sequesterRsrc --keepParent "dist/${APP}.app" "$ARCHIVE"
          echo "package status=ok archive=$ARCHIVE bytes=$(wc -c < "$ARCHIVE")"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check.outputs.tag }}"
          ARCHIVE="${{ needs.check.outputs.archive }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --clobber
            echo "release status=asset_replaced tag=$TAG"
          else
            FLAGS=(--target "$GITHUB_SHA" --title "$TAG" --generate-notes)
            if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "$ARCHIVE" "${FLAGS[@]}"
            echo "release status=created tag=$TAG prerelease=${{ needs.check.outputs.prerelease }} commit=$GITHUB_SHA"
          fi

      - name: Update appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          TAG="${{ needs.check.outputs.tag }}"
          ARCHIVE="${{ needs.check.outputs.archive }}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          MIN_SYSTEM="$(plutil -extract LSMinimumSystemVersion raw Support/Info.plist)"

          if git clone --branch "$APPCAST_BRANCH" --depth 1 "$REMOTE" appcast-work 2>/dev/null; then
            echo "appcast-branch status=existing name=$APPCAST_BRANCH"
          else
            mkdir -p appcast-work
            git -C appcast-work init -q
            git -C appcast-work checkout -q -b "$APPCAST_BRANCH"
            git -C appcast-work remote add origin "$REMOTE"
            echo "appcast-branch status=created name=$APPCAST_BRANCH"
          fi

          python3 Scripts/make-appcast.py \
            --appcast "appcast-work/${APPCAST_FILE}" \
            --archive "$ARCHIVE" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ARCHIVE}" \
            --version "${{ github.run_number }}" \
            --short-version "${{ needs.check.outputs.short }}" \
            --channel "${{ needs.check.outputs.channel }}" \
            --min-system "$MIN_SYSTEM" \
            --release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --sign-update ".build/artifacts/sparkle/Sparkle/bin/sign_update" \
            --private-key-file "-" \
            --feed-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${APPCAST_BRANCH}/${APPCAST_FILE}"

          git -C appcast-work config user.name "github-actions[bot]"
          git -C appcast-work config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C appcast-work add "$APPCAST_FILE"
          if git -C appcast-work diff --cached --quiet; then
            echo "appcast status=unchanged"
          else
            git -C appcast-work commit -m "appcast: $TAG (${{ needs.check.outputs.channel }})"
            git -C appcast-work push origin "$APPCAST_BRANCH"
            echo "appcast status=published branch=$APPCAST_BRANCH"
          fi

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### ${APP} ${{ needs.check.outputs.short }}"
            echo ""
            echo "- channel: \`${{ needs.check.outputs.channel }}\`"
            echo "- pre-release: \`${{ needs.check.outputs.prerelease }}\`"
            echo "- build: \`${{ github.run_number }}\`"
            echo "- release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ needs.check.outputs.tag }}"
            echo "- feed: \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${APPCAST_BRANCH}/${APPCAST_FILE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
